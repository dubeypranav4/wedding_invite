<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="twitter:description" content="Together with their families — join us to celebrate our wedding. Saturday, 12th December 2026 · Hotel Raghubar Kripa, Lucknow.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&family=Tiro+Devanagari+Hindi:ital@0;1&family=Mukta:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Wedding palette — ivory, maroon, deep red & gold */
    --ivory:#FBF2E9;
    --charcoal:#3A161B;
    --rose:#9C2A33;
    --gold:#C19A3C;
    --gold-soft:#E0C98E;
    --muted:#7a564e;
    --muted2:#9a7c72;
    --panel:rgba(251,242,233,0.86);
    --card1:#f3e7d8;
    --card2:#ecd9c2;
    color-scheme:light;
  }
  body.dark{
    --ivory:#180d0f;
    --charcoal:#F3E3D6;
    --rose:#E08088;
    --gold:#D4B35E;
    --gold-soft:#8a6f3f;
    --muted:#c4ab9f;
    --muted2:#9a8073;
    --panel:rgba(42,22,25,0.82);
    --card1:#2a181b;
    --card2:#221215;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--ivory);
    overflow-x:hidden;
    transition:background 0.35s ease, color 0.35s ease;
  }
  .stage{
    position:relative;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 0;
    background:
      radial-gradient(circle at 50% 16%, rgba(193,154,60,0.12), transparent 55%),
      radial-gradient(circle at 50% 92%, rgba(156,42,51,0.08), transparent 50%);
  }
  .frame{
    width:min(560px, 88vw);
    text-align:center;
    padding:48px 32px;
    position:relative;
    z-index:1;
  }

  /* Fireflies / floating embers */
  .fireflies{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .firefly{
    position:absolute;
    left:50%;
    top:50%;
    width:0.4vw;
    height:0.4vw;
    margin:-0.2vw 0 0 9.8vw;
    animation:ease 120s alternate infinite;
    pointer-events:none;
  }
  .firefly::before,
  .firefly::after{
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    transform-origin:-10vw;
  }
  .firefly::before{
    background:var(--rose);
    opacity:0.12;
    animation:drift ease alternate infinite;
  }
  .firefly::after{
    background:#fff3d6;
    opacity:0;
    box-shadow:0 0 0vw 0vw #e8b84b;
    animation:drift ease alternate infinite, flash ease infinite;
  }
  @keyframes drift{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
  }
  @keyframes flash{
    0%, 30%, 100%{ opacity:0; box-shadow:0 0 0vw 0vw #e8b84b; }
    5%{ opacity:1; box-shadow:0 0 2.4vw 0.55vw #f0be4f; }
  }
  @media (prefers-reduced-motion: reduce){
    .fireflies{ display:none; }
  }

  /* Mandala motif */
  .motif{
    width:120px;
    height:120px;
    margin:0 auto 12px;
    display:block;
  }
  .motif .ring,
  .motif .petal{
    fill:none;
    stroke:var(--gold);
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .motif .ring{
    stroke-width:1.5;
    stroke-dasharray:360;
    stroke-dashoffset:360;
    animation:draw 1.6s ease-out forwards;
  }
  .motif .ring.inner{ animation-delay:0.25s; }
  .motif .petal{
    stroke-width:1.4;
    stroke-dasharray:200;
    stroke-dashoffset:200;
    animation:draw 1s ease-out forwards;
  }
  .motif .p1{ animation-delay:0.55s; }
  .motif .p2{ animation-delay:0.68s; }
  .motif .p3{ animation-delay:0.81s; }
  .motif .p4{ animation-delay:0.94s; }
  .motif .p5{ animation-delay:1.07s; }
  .motif .p6{ animation-delay:1.20s; }
  .motif .p7{ animation-delay:1.33s; }
  .motif .p8{ animation-delay:1.46s; }
  .motif .core{
    fill:var(--rose);
    stroke:var(--gold);
    stroke-width:1;
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:bloom 0.7s ease-out forwards;
    animation-delay:1.9s;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes bloom{
    0%{ opacity:0; transform:scale(0.1); }
    70%{ opacity:1; transform:scale(1.25); }
    100%{ opacity:1; transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .motif .ring,
    .motif .petal{ stroke-dashoffset:0; animation:none; }
    .motif .core{ opacity:1; transform:none; animation:none; }
  }

  .eyebrow{
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:13px;
    letter-spacing:0.28em;
    color:var(--rose);
    opacity:0;
    transform:translateY(8px);
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:2.15s;
    margin:14px 0 0;
  }

  .names{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:clamp(30px, 8.5vw, 58px);
    line-height:1.08;
    color:var(--charcoal);
    margin:0;
    opacity:0;
    transform:translateY(14px);
    animation:riseIn 1s ease-out forwards;
    animation-delay:1.6s;
  }
  .names .amp{
    font-style:italic;
    color:var(--rose);
    font-size:0.75em;
    padding:0 6px;
  }

  .divider{
    width:0;
    height:1px;
    background:var(--gold);
    margin:24px auto;
    animation:growLine 0.8s ease-out forwards;
    animation-delay:2.9s;
  }
  @keyframes growLine{ to{ width:64px; } }

  .invite-line{
    font-family:'Jost',sans-serif;
    font-weight:300;
    font-size:16px;
    letter-spacing:0.02em;
    color:var(--charcoal);
    opacity:0;
    max-width:380px;
    margin:0 auto 10px;
    line-height:1.6;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:3.3s;
  }

  /* Events / schedule */
  .sched-head{
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--rose);
    margin:26px 0 2px;
    opacity:0;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:3.7s;
  }
  .events{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin:18px auto 0;
    max-width:440px;
  }
  .event{
    border:1px solid var(--gold-soft);
    border-radius:6px;
    padding:20px 18px 18px;
    background:linear-gradient(135deg,var(--card1),var(--card2));
    opacity:0;
    transform:translateY(14px);
    animation:riseIn 0.8s ease-out forwards;
  }
  .ev-name{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:26px;
    line-height:1.1;
    color:var(--charcoal);
    margin-bottom:8px;
  }
  .ev-date{
    font-family:'Jost',sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--charcoal);
    letter-spacing:0.02em;
  }
  .ev-time{
    font-family:'Jost',sans-serif;
    font-size:13px;
    font-weight:300;
    color:var(--rose);
    letter-spacing:0.04em;
    margin-top:2px;
  }
  .ev-venue{
    font-family:'Jost',sans-serif;
    font-size:12.5px;
    font-weight:300;
    color:var(--muted);
    letter-spacing:0.02em;
    line-height:1.5;
    margin-top:7px;
  }
  .ev-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:14px;
  }
  body.hi .ev-name{ font-family:'Tiro Devanagari Hindi',serif; }
  body.hi .ev-date,
  body.hi .ev-time,
  body.hi .ev-venue,
  body.hi .sched-head{ font-family:'Mukta',sans-serif; }
  body.hi .sched-head{ letter-spacing:0.08em; }

  /* Countdown */
  .countdown{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:6px;
    margin:28px auto 2px;
    opacity:0;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:4.2s;
  }
  .cd-cap{
    font-family:'Jost',sans-serif;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted2);
    margin:26px 0 -6px;
    opacity:0;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:4.1s;
  }
  body.hi .cd-cap{ font-family:'Mukta',sans-serif; letter-spacing:0.06em; }
  .cd-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:56px;
  }
  .cd-num{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:34px;
    line-height:1;
    color:var(--charcoal);
    font-variant-numeric:tabular-nums;
  }
  .cd-lbl{
    font-family:'Jost',sans-serif;
    font-size:10px;
    font-weight:400;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--rose);
    margin-top:6px;
  }
  .cd-sep{
    font-family:'Cormorant Garamond',serif;
    font-size:28px;
    line-height:1.1;
    color:var(--gold-soft);
  }
  .countdown.done{ gap:0; }
  .cd-done{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:22px;
    color:var(--gold);
  }
  body.hi .cd-lbl{ font-family:'Mukta',sans-serif; letter-spacing:0.06em; }
  body.hi .cd-done{ font-family:'Tiro Devanagari Hindi',serif; font-style:normal; }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    padding:11px 20px;
    border:1px solid var(--gold);
    border-radius:2px;
    background:transparent;
    color:var(--charcoal);
    transition:background 0.25s ease, color 0.25s ease;
  }
  .btn:hover{
    background:var(--gold);
    color:var(--ivory);
  }
  .btn svg{
    width:15px;
    height:15px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.6;
  }
  .btn-sm{
    padding:8px 14px;
    font-size:11.5px;
    letter-spacing:0.06em;
  }
  .btn-sm svg{ width:13px; height:13px; }
  body.hi .btn{ font-family:'Mukta',sans-serif; }

  .actions{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:26px;
    opacity:0;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:4.5s;
  }

  /* Video invite */
  .video-card{
    position:relative;
    width:100%;
    max-width:480px;
    margin:26px auto 0;
    aspect-ratio:16 / 9;
    border:1px solid var(--gold-soft);
    border-radius:5px;
    overflow:hidden;
    background:linear-gradient(135deg,var(--card1),var(--card2));
    opacity:0;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:4.7s;
  }
  .video-card video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    cursor:pointer;
  }
  .vc-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    cursor:pointer;
    transition:opacity 0.4s ease;
  }
  .video-card.playing .vc-overlay{ opacity:0; pointer-events:none; }
  .vc-play{
    width:56px;
    height:56px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    background:rgba(251,242,233,0.8);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .vc-play svg{ width:22px; height:22px; fill:var(--charcoal); margin-left:3px; }
  .vc-overlay span{
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  body.hi .vc-overlay span{ font-family:'Mukta',sans-serif; }
  .vc-controls{
    position:absolute;
    right:10px;
    bottom:10px;
    display:flex;
    gap:8px;
    z-index:2;
  }
  .vc-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    border:0;
    cursor:pointer;
    background:rgba(58,22,27,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(3px);
    transition:background 0.2s ease;
  }
  .vc-btn:hover{ background:rgba(58,22,27,0.82); }
  .vc-btn svg{ width:17px; height:17px; fill:none; stroke:#fff; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .vc-hint{
    position:absolute;
    left:10px;
    bottom:16px;
    z-index:2;
    font-family:'Jost',sans-serif;
    font-size:11px;
    letter-spacing:0.08em;
    color:#fff;
    background:rgba(58,22,27,0.5);
    padding:5px 11px;
    border-radius:14px;
    backdrop-filter:blur(3px);
    opacity:0;
    cursor:pointer;
    pointer-events:none;
    transition:opacity 0.4s ease;
  }
  .video-card.playing:not(.unmuted) .vc-hint{ opacity:1; pointer-events:auto; }

  /* Language toggle */
  .lang-toggle{
    position:fixed;
    top:16px;
    right:16px;
    z-index:10;
    display:inline-flex;
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:0.06em;
    border:1px solid var(--gold-soft);
    border-radius:20px;
    overflow:hidden;
    background:var(--panel);
    backdrop-filter:blur(4px);
  }
  .lang-toggle button{
    border:0;
    background:transparent;
    cursor:pointer;
    padding:6px 14px;
    color:var(--muted2);
    font:inherit;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .lang-toggle button.active{
    background:var(--gold);
    color:var(--ivory);
  }

  /* Theme (dark mode) toggle */
  .theme-toggle{
    position:fixed;
    top:16px;
    left:16px;
    z-index:10;
    display:inline-flex;
    border:1px solid var(--gold-soft);
    border-radius:20px;
    overflow:hidden;
    background:var(--panel);
    backdrop-filter:blur(4px);
  }
  .theme-toggle button{
    border:0;
    background:transparent;
    cursor:pointer;
    padding:7px 12px;
    color:var(--muted2);
    display:flex;
    align-items:center;
    transition:color 0.2s ease;
  }
  .theme-toggle button:hover{ color:var(--gold); }
  .theme-toggle svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

  /* Devanagari typography when Hindi is active */
  body.hi .eyebrow,
  body.hi .invite-line{
    font-family:'Mukta',sans-serif;
  }
  body.hi .names,
  body.hi .closing{
    font-family:'Tiro Devanagari Hindi',serif;
  }
  body.hi .names{ font-size:clamp(30px, 7.6vw, 52px); }
  body.hi .eyebrow{ letter-spacing:0.12em; }

  /* Phone / small-tablet scaling */
  @media (max-width:560px){
    .frame{ padding:36px 20px; }
    .eyebrow{ font-size:11px; letter-spacing:0.16em; }
    .invite-line{ font-size:15px; }
    .ev-name{ font-size:23px; }
    .cd-num{ font-size:28px; }
    .cd-unit{ min-width:44px; }
    .cd-lbl{ font-size:9px; letter-spacing:0.1em; }
    .actions{ gap:10px; }
    .btn{ padding:10px 16px; font-size:12px; }
  }
  @media (max-width:360px){
    .cd-unit{ min-width:40px; }
    .cd-num{ font-size:25px; }
    .cd-sep{ font-size:22px; }
  }

  .closing{
    margin-top:30px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:17px;
    color:var(--rose);
    opacity:0;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:5.0s;
  }

  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0); }
  }

</style>
</head>
<body>
<div class="theme-toggle">
  <button type="button" id="themeBtn" aria-label="Toggle dark mode"></button>
</div>
<div class="lang-toggle" role="group" aria-label="Language">
  <button type="button" id="langEn" class="active">EN</button>
  <button type="button" id="langHi">हिं</button>
</div>
<div class="stage">
  <div class="frame">
    <svg class="motif" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="ring outer" cx="60" cy="60" r="52"/>
      <circle class="ring inner" cx="60" cy="60" r="38"/>
      <g>
        <path class="petal p1" transform="rotate(0 60 60)"   d="M60 60 C 50 42 50 24 60 14 C 70 24 70 42 60 60 Z"/>
        <path class="petal p2" transform="rotate(45 60 60)"  d="M60 60 C 50 42 50 24 60 14 C 70 24 70 42 60 60 Z"/>
        <path class="petal p3" transform="rotate(90 60 60)"  d="M60 60 C 50 42 50 24 60 14 C 70 24 70 42 60 60 Z"/>
        <path class="petal p4" transform="rotate(135 60 60)" d="M60 60 C 50 42 50 24 60 14 C 70 24 70 42 60 60 Z"/>
        <path class="petal p5" transform="rotate(180 60 60)" d="M60 60 C 50 42 50 24 60 14 C 70 24 70 42 60 60 Z"/>
        <path class="petal p6" transform="rotate(225 60 60)" d="M60 60 C 50 42 50 24 60 14 C 70 24 70 42 60 60 Z"/>
        <path class="petal p7" transform="rotate(270 60 60)" d="M60 60 C 50 42 50 24 60 14 C 70 24 70 42 60 60 Z"/>
        <path class="petal p8" transform="rotate(315 60 60)" d="M60 60 C 50 42 50 24 60 14 C 70 24 70 42 60 60 Z"/>
      </g>
      <circle class="core" cx="60" cy="60" r="7"/>
    </svg>

    <h1 class="names" id="t_names">Shanu <span class="amp">&amp;</span> Pranav</h1>

    <p class="eyebrow" id="t_eyebrow">TOGETHER WITH THEIR FAMILIES</p>

    <div class="divider"></div>

    <p class="invite-line" id="t_invite">request the pleasure of your company as they celebrate their wedding</p>

    <div class="sched-head" id="t_sched">Celebrations</div>
    <div class="events" id="events"></div>

    <div class="cd-cap" id="t_cdcap">Counting down to the wedding</div>
    <div class="countdown" id="countdown">
      <div class="cd-unit"><span class="cd-num" id="cdDays">--</span><span class="cd-lbl" id="cdDaysL">Days</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span class="cd-num" id="cdHours">--</span><span class="cd-lbl" id="cdHoursL">Hours</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span class="cd-num" id="cdMins">--</span><span class="cd-lbl" id="cdMinsL">Minutes</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span class="cd-num" id="cdSecs">--</span><span class="cd-lbl" id="cdSecsL">Seconds</span></div>
    </div>

    <div class="video-card" id="videoCard" aria-label="Video invitation">
      <video id="inviteVideo" muted loop playsinline preload="none"></video>
      <div class="vc-overlay" id="vcOverlay">
        <div class="vc-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <span id="vcLabel">Watch our video invite</span>
      </div>
      <div class="vc-hint" id="vcHint">Tap for sound</div>
      <div class="vc-controls">
        <button class="vc-btn" id="vcSound" type="button" aria-label="Unmute"></button>
        <button class="vc-btn" id="vcFull" type="button" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4"/></svg>
        </button>
      </div>
    </div>

    <p class="closing" id="t_closing">With love, we hope you'll be there</p>
  </div>
</div>

<script>
  /* Start at the top: stop the browser from restoring a previous scroll
     position (common on phones after reload / back-forward). */
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.scrollTo(0, 0);
  window.addEventListener("load", function(){ window.scrollTo(0, 0); });

  /* ===== Dark mode toggle ===== */
  (function(){
    const btn = document.getElementById("themeBtn");
    const moon = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    const sun  = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/>' +
      '<path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>';
    function setDark(dark){
      document.body.classList.toggle("dark", dark);
      btn.innerHTML = dark ? sun : moon;
      btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      try { localStorage.setItem("inviteTheme", dark ? "dark" : "light"); } catch(e){}
    }
    let dark = false;
    try {
      const saved = localStorage.getItem("inviteTheme");
      if (saved) dark = (saved === "dark");
      else dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    } catch(e){}
    setDark(dark);
    btn.addEventListener("click", function(){
      setDark(!document.body.classList.contains("dark"));
    });
  })();
  /* ============================ */

  /* ===== Fireflies ===== */
  (function(){
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const N = 24;
    const rnd = (min, max) => Math.random() * (max - min) + min;
    const container = document.createElement("div");
    container.className = "fireflies";
    container.setAttribute("aria-hidden", "true");
    const rules = [];
    for (let i = 1; i <= N; i++){
      container.appendChild(Object.assign(document.createElement("div"), { className: "firefly" }));
      const steps = Math.floor(rnd(16, 28));
      const rot = rnd(8, 18).toFixed(1);
      const flashDur = Math.floor(rnd(5000, 11000));
      const flashDelay = Math.floor(rnd(500, 8500));
      let kf = "@keyframes move" + i + "{";
      for (let s = 0; s <= steps; s++){
        const pct = (s * (100 / steps)).toFixed(2);
        kf += pct + "%{transform:translateX(" + rnd(-50, 50).toFixed(1) + "vw) translateY("
          + rnd(-50, 50).toFixed(1) + "vh) scale(" + rnd(0.25, 1).toFixed(2) + ");}";
      }
      kf += "}";
      rules.push(kf,
        ".firefly:nth-child(" + i + "){animation-name:move" + i + ";}",
        ".firefly:nth-child(" + i + ")::before{animation-duration:" + rot + "s;}",
        ".firefly:nth-child(" + i + ")::after{animation-duration:" + rot + "s," + flashDur
          + "ms;animation-delay:0ms," + flashDelay + "ms;}");
    }
    const style = document.createElement("style");
    style.textContent = rules.join("");
    document.head.appendChild(style);
    document.body.insertBefore(container, document.body.firstChild);
  })();
  /* ===================== */

  /* ===== Configure your event here ===== */
  const CONFIG = {
    coupleTitle: "Shanu & Pranav",   // used as the calendar event prefix
    // Local video invite (lazy-loaded). Leave "" to hide the player.
    // Drop your file at assets/video_invite.mp4 — the card hides itself until it exists.
    inviteVideo:  "assets/video_invite.mp4",

    // Which event the big countdown points at:
    countdownEventId: "wedding",

    // ---- Events ----
    // restricted:true  -> only guests with the Haldi link (?h=<HALDI_CODE>) see it.
    // restricted:false -> everyone sees it (the default invite).
    events: [
      {
        id: "haldi",
        restricted: true,
        start: "2026-12-11T11:00:00+05:30",
        durationHours: 6,
        // Directions route from each guest to this destination:
        mapsDestination: "26.885475,80.931033",
        icsLocation: "40-A Vimla Sadan, Triveni Nagar, Lucknow, Uttar Pradesh",
      },
      {
        id: "wedding",
        restricted: false,
        start: "2026-12-12T18:00:00+05:30",
        durationHours: 6,
        mapsDestination: "Hotel Raghubar Kripa, Sitapur Rd, Iradat Nagar, Daliganj, Lucknow, Uttar Pradesh 226020",
        icsLocation: "Hotel Raghubar Kripa, Sitapur Rd, Iradat Nagar, Daliganj, Lucknow, Uttar Pradesh 226020",
      },
    ],
  };

  /* ===== Guest access (static-site "gating") =====
     This is a public static page, so this is NOT real security — anyone with the
     code in the link can view the Haldi events. It's just to keep the default
     invite (wedding only) separate from the close-family invite.

     Share:
       Everyone  ->  https://dubeypranav4.github.io/wedding_invite/
       Family    ->  https://dubeypranav4.github.io/wedding_invite/?h=parivaar
     Change the code below any time.                                        */
  const HALDI_CODE = "parivaar";
  function haldiUnlocked(){
    const p = new URLSearchParams(location.search);
    return (p.get("h") || p.get("haldi")) === HALDI_CODE || p.get("all") === "1";
  }
  function visibleEvents(){
    const unlocked = haldiUnlocked();
    return CONFIG.events.filter(e => !e.restricted || unlocked);
  }
  /* ================================================ */

  /* ===== Bilingual text (English / Hindi) ===== */
  const STRINGS = {
    en: {
      eyebrow: "TOGETHER WITH THEIR FAMILIES",
      names:   'Shanu <span class="amp">&amp;</span> Pranav',
      invite:  "request the pleasure of your company as they celebrate their wedding",
      sched:   "Celebrations",
      closing: "With love, we hope you'll be there",
      dir:     "Directions",
      cal:     "Add to Calendar",
      cdCap:   "Counting down to the wedding",
      cdDays:  "Days",
      cdHours: "Hours",
      cdMins:  "Minutes",
      cdSecs:  "Seconds",
      cdDone:  "The day is finally here",
      vcLabel: "Watch our video invite",
      vcHint:  "Tap for sound",
      events: {
        haldi:   { name: "Haldi & Mehendi", date: "Friday, 11th December 2026",   time: "11:00 AM onwards", venue: "40-A Vimla Sadan, Triveni Nagar, Lucknow" },
        wedding: { name: "The Wedding",      date: "Saturday, 12th December 2026", time: "6:00 PM onwards",  venue: "Hotel Raghubar Kripa, Daliganj, Lucknow" },
      },
    },
    hi: {
      eyebrow: "अपने परिवारों के साथ",
      names:   'शानू <span class="amp">और</span> प्रणव',
      invite:  "अपने विवाह के शुभ अवसर पर आपकी गरिमामयी उपस्थिति की सादर प्रार्थना करते हैं",
      sched:   "समारोह",
      closing: "सादर — हमें आपके आने की प्रतीक्षा रहेगी",
      dir:     "रास्ता देखें",
      cal:     "कैलेंडर में जोड़ें",
      cdCap:   "विवाह की ओर गिनती",
      cdDays:  "दिन",
      cdHours: "घंटे",
      cdMins:  "मिनट",
      cdSecs:  "सेकंड",
      cdDone:  "आज वो शुभ दिन है",
      vcLabel: "हमारा वीडियो निमंत्रण देखें",
      vcHint:  "आवाज़ के लिए टैप करें",
      events: {
        haldi:   { name: "हल्दी एवं मेहंदी", date: "शुक्रवार, 11 दिसंबर 2026", time: "सुबह 11:00 बजे से", venue: "40-A विमला सदन, त्रिवेणी नगर, लखनऊ" },
        wedding: { name: "विवाह समारोह",     date: "शनिवार, 12 दिसंबर 2026",  time: "शाम 6:00 बजे से",  venue: "होटल रघुबर कृपा, दलीगंज, लखनऊ" },
      },
    },
  };

  /* ===== Calendar / directions helpers (per event) ===== */
  function pad(n){ return String(n).padStart(2, "0"); }
  function toICSDate(d){
    return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate())
      + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + "Z";
  }
  function icsEscape(s){
    return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  }
  function directionsUrl(ev){
    return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(ev.mapsDestination);
  }
  function eventDates(ev){
    const start = new Date(ev.start);
    const end = new Date(start.getTime() + (ev.durationHours || 6) * 3600 * 1000);
    return { start, end };
  }
  function eventTitle(ev, lang){
    const name = (STRINGS[lang].events[ev.id] || {}).name || ev.id;
    return CONFIG.coupleTitle + " — " + name;
  }
  function gcalQueryFor(ev, lang){
    const { start, end } = eventDates(ev);
    return new URLSearchParams({
      action: "TEMPLATE",
      text: eventTitle(ev, lang),
      dates: toICSDate(start) + "/" + toICSDate(end),
      details: "With love, Shanu & Pranav",
      location: ev.icsLocation,
    }).toString();
  }
  function openAndroidCalendar(ev, lang){
    const q = gcalQueryFor(ev, lang);
    const webUrl = "https://calendar.google.com/calendar/render?" + q;
    const intentUrl = "intent://calendar.google.com/calendar/render?" + q
      + "#Intent;scheme=https;package=com.google.android.calendar;"
      + "S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end";
    window.location.href = intentUrl;
  }
  function downloadICS(ev, lang){
    const { start, end } = eventDates(ev);
    const ics = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//wedding-invite//EN",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH",
      "BEGIN:VEVENT",
      "UID:" + start.getTime() + "-" + ev.id + "@wedding-invite",
      "DTSTAMP:" + toICSDate(new Date()),
      "DTSTART:" + toICSDate(start),
      "DTEND:" + toICSDate(end),
      "SUMMARY:" + icsEscape(eventTitle(ev, lang)),
      "LOCATION:" + icsEscape(ev.icsLocation),
      "URL:" + icsEscape(directionsUrl(ev)),
      "END:VEVENT",
      "END:VCALENDAR",
    ].join("\r\n");
    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = ev.id + ".ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  const ua = navigator.userAgent || "";
  const isAndroid = /Android/i.test(ua);
  function addToCalendar(ev, lang){
    if (isAndroid) openAndroidCalendar(ev, lang);
    else downloadICS(ev, lang); // Apple + everything else
  }

  const dirSvg = '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.4-7-11a7 7 0 0 1 14 0c0 4.6-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  const calSvg = '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>';

  /* ===== Render the event schedule ===== */
  let eventsRendered = false;   // entrance animation only on the very first render
  function renderEvents(lang){
    const wrap = document.getElementById("events");
    const list = visibleEvents();
    const s = STRINGS[lang] || STRINGS.en;
    wrap.innerHTML = "";
    document.getElementById("t_sched").style.display = list.length > 1 ? "" : "none";
    list.forEach(function(ev, i){
      const t = (s.events[ev.id]) || {};
      const card = document.createElement("div");
      card.className = "event";
      if (eventsRendered){
        // Re-render (e.g. language switch): show instantly, no replayed delay.
        card.style.animation = "none";
        card.style.opacity = "1";
        card.style.transform = "none";
      } else {
        card.style.animationDelay = (3.9 + i * 0.25) + "s";
      }
      card.innerHTML =
        '<div class="ev-name">' + (t.name || ev.id) + '</div>' +
        '<div class="ev-date">' + (t.date || "") + '</div>' +
        '<div class="ev-time">' + (t.time || "") + '</div>' +
        '<div class="ev-venue">' + (t.venue || "") + '</div>' +
        '<div class="ev-actions">' +
          '<a class="btn btn-sm ev-dir" href="' + directionsUrl(ev) + '" target="_blank" rel="noopener">' + dirSvg + '<span>' + s.dir + '</span></a>' +
          '<button class="btn btn-sm ev-cal" type="button">' + calSvg + '<span>' + s.cal + '</span></button>' +
        '</div>';
      card.querySelector(".ev-cal").addEventListener("click", function(){ addToCalendar(ev, lang); });
      wrap.appendChild(card);
    });
    eventsRendered = true;
  }

  /* ===== Apply language ===== */
  function applyLang(lang){
    const s = STRINGS[lang] || STRINGS.en;
    document.getElementById("t_eyebrow").textContent = s.eyebrow;
    document.getElementById("t_names").innerHTML = s.names;
    document.getElementById("t_invite").textContent = s.invite;
    document.getElementById("t_sched").textContent = s.sched;
    document.getElementById("t_cdcap").textContent = s.cdCap;
    document.getElementById("t_closing").textContent = s.closing;
    const setLbl = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
    setLbl("cdDaysL", s.cdDays);
    setLbl("cdHoursL", s.cdHours);
    setLbl("cdMinsL", s.cdMins);
    setLbl("cdSecsL", s.cdSecs);
    const cdDoneEl = document.querySelector("#countdown .cd-done");
    if (cdDoneEl) cdDoneEl.textContent = s.cdDone;
    setLbl("vcLabel", s.vcLabel);
    setLbl("vcHint", s.vcHint);
    document.body.classList.toggle("hi", lang === "hi");
    document.documentElement.lang = lang;
    document.getElementById("langEn").classList.toggle("active", lang !== "hi");
    document.getElementById("langHi").classList.toggle("active", lang === "hi");
    renderEvents(lang);
    try { localStorage.setItem("inviteLang", lang); } catch(e){}
  }

  document.getElementById("langEn").addEventListener("click", () => applyLang("en"));
  document.getElementById("langHi").addEventListener("click", () => applyLang("hi"));

  let savedLang = "en";
  try { savedLang = localStorage.getItem("inviteLang") || "en"; } catch(e){}
  const urlLang = new URLSearchParams(location.search).get("lang");
  if (urlLang === "hi" || urlLang === "en") savedLang = urlLang;
  applyLang(savedLang);

  /* ===== Lazy-loaded video invite (muted; tap for sound; fullscreen) ===== */
  (function(){
    const card = document.getElementById("videoCard");
    if (!card) return;
    if (!CONFIG.inviteVideo){ card.style.display = "none"; return; }
    const video = document.getElementById("inviteVideo");
    const overlay = document.getElementById("vcOverlay");
    const soundBtn = document.getElementById("vcSound");
    const fullBtn = document.getElementById("vcFull");
    const hint = document.getElementById("vcHint");

    // If the video file isn't there yet, hide the player gracefully.
    video.addEventListener("error", function(){ card.style.display = "none"; });

    const speaker = 'M4 9v6h4l5 4V5L8 9H4z';
    function setSoundIcon(){
      const on = !video.muted;
      soundBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + speaker + '"/>' +
        (on ? '<path d="M15.5 9.2a3.4 3.4 0 0 1 0 5.6"/><path d="M17.8 7a7 7 0 0 1 0 10"/>'
            : '<path d="M16.5 9.5l4 5M20.5 9.5l-4 5"/>') + '</svg>';
      soundBtn.setAttribute("aria-label", on ? "Mute" : "Unmute");
      card.classList.toggle("unmuted", on);
    }
    setSoundIcon();

    let loaded = false;
    function ensureLoaded(){
      if (loaded) return;
      video.src = CONFIG.inviteVideo;   // download starts only now (preload=none)
      video.load();
      loaded = true;
    }
    function play(){
      ensureLoaded();
      const p = video.play();
      if (p && p.catch) p.catch(function(){});
    }
    video.addEventListener("playing", function(){ card.classList.add("playing"); });

    if ("IntersectionObserver" in window){
      const io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if (e.isIntersecting) play();
          else if (loaded) video.pause();
        });
      }, { threshold: 0.35 });
      io.observe(card);
    } else {
      play();
    }

    function toggleSound(e){
      if (e) e.stopPropagation();
      ensureLoaded();
      video.muted = !video.muted;
      if (!video.muted) play();
      setSoundIcon();
    }
    overlay.addEventListener("click", function(){ toggleSound(); });
    video.addEventListener("click", function(){ toggleSound(); });
    soundBtn.addEventListener("click", toggleSound);
    hint.addEventListener("click", toggleSound);
    fullBtn.addEventListener("click", function(e){
      e.stopPropagation();
      if (video.requestFullscreen) video.requestFullscreen();
      else if (card.requestFullscreen) card.requestFullscreen();
      else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iOS Safari
    });
  })();
  /* ===================================================================== */

  /* ===== Countdown to the wedding ===== */
  const countdownEvent = CONFIG.events.find(e => e.id === CONFIG.countdownEventId) || CONFIG.events[CONFIG.events.length - 1];
  const targetTime = new Date(countdownEvent.start).getTime();
  const cdEl = {
    days: document.getElementById("cdDays"),
    hours: document.getElementById("cdHours"),
    mins: document.getElementById("cdMins"),
    secs: document.getElementById("cdSecs"),
  };
  const countdownWrap = document.getElementById("countdown");
  function tickCountdown(){
    const diff = targetTime - Date.now();
    if (diff <= 0){
      countdownWrap.classList.add("done");
      const s = STRINGS[document.body.classList.contains("hi") ? "hi" : "en"];
      countdownWrap.innerHTML = '<div class="cd-done">' + s.cdDone + '</div>';
      clearInterval(cdTimer);
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const sec = Math.floor((diff % 60000) / 1000);
    cdEl.days.textContent  = d;
    cdEl.hours.textContent = pad(h);
    cdEl.mins.textContent  = pad(m);
    cdEl.secs.textContent  = pad(sec);
  }
  tickCountdown();
  const cdTimer = setInterval(tickCountdown, 1000);
</script>
</body>
</html>
